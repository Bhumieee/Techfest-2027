<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | TechFest 2027</title>
    <meta
      name="description"
      content="TechFest 2027 — college festival celebrating technology, creativity and innovation."
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <a class="brand" href="index.html"
        ><img src="assets/techfest-logo.svg" alt="TechFest logo" />TechFest
        2027</a
      >
      <nav aria-label="Main navigation">
        <a href="index.html">Home</a><a href="events.html">Events</a
        ><a href="schedule.html">Schedule</a
        ><a href="register.html" aria-current="page">Register</a
        ><a href="contact.html">Contact</a>
      </nav>
    </header>
    <main>
      <section>
        <h1>Participant registration</h1>
        <p class="muted">
          Fill in your details and select the events you would like to join.
        </p>
        <form
          action="#"
          method="get"
          onsubmit="
            alert('Thank you! This demo form has been submitted.');
            return false;
          "
        >
          <div class="form-row">
            <div>
              <label for="name">Full name</label
              ><input
                id="name"
                name="name"
                type="text"
                placeholder="Your full name"
                required
              />
            </div>
            <div>
              <label for="email">Email address</label
              ><input
                id="email"
                name="email"
                type="email"
                placeholder="you@example.com"
                required
              />
            </div>
          </div>
          <div class="form-row">
            <div>
              <label for="phone">Phone number</label
              ><input
                id="phone"
                name="phone"
                type="tel"
                pattern="[0-9+() -]{8,15}"
                placeholder="Your contact number"
                required
              />
            </div>
            <div>
              <label for="department">Department</label
              ><select id="department" name="department" required>
                <option value="">Choose department</option>
                <option>Computer Science</option>
                <option>Electronics</option>
                <option>Mechanical</option>
                <option>Management</option>
                <option>Other</option>
              </select>
            </div>
          </div>
          <label>Year of study</label>
          <div class="choice">
            <label
              ><input type="radio" name="year" value="1st" required />1st
              year</label
            >
          </div>
          <div class="choice">
            <label
              ><input type="radio" name="year" value="2nd" />2nd year</label
            >
          </div>
          <div class="choice">
            <label
              ><input type="radio" name="year" value="3rd" />3rd year</label
            >
          </div>
          <div class="choice">
            <label
              ><input type="radio" name="year" value="4th" />4th year</label
            >
          </div>
          <label>Event preferences (select all that apply)</label>
          <div class="choice">
            <label
              ><input
                type="checkbox"
                name="events"
                value="CodeSprint"
              />CodeSprint</label
            >
          </div>
          <div class="choice">
            <label
              ><input
                type="checkbox"
                name="events"
                value="RoboRace"
              />RoboRace</label
            >
          </div>
          <div class="choice">
            <label
              ><input
                type="checkbox"
                name="events"
                value="PixelPerfect"
              />PixelPerfect</label
            >
          </div>
          <div class="choice">
            <label
              ><input
                type="checkbox"
                name="events"
                value="TechQuiz"
              />TechQuiz</label
            >
          </div>
          <div class="choice">
            <label
              ><input
                type="checkbox"
                name="events"
                value="IdeaForge"
              />IdeaForge</label
            >
          </div>
          <div class="choice">
            <label
              ><input
                type="checkbox"
                name="events"
                value="GameArena"
              />GameArena</label
            >
          </div>
          <label for="message">Any questions or special requirements?</label
          ><textarea
            id="message"
            name="message"
            rows="4"
            placeholder="Write your message here..."
          ></textarea>
          <p>
            <label class="choice"
              ><input type="checkbox" required /> I confirm that the information
              provided is correct.</label
            >
          </p>
          <button class="button" type="submit">Submit registration</button
          ><button class="button secondary" type="reset">Clear form</button>
        </form>
      </section>
    </main>
    <footer>
      <p><strong>TechFest 2027</strong> · Create. Compete. Celebrate.</p>
      <p>
        Made for the College Fest Website HTML project ·
        <a href="contact.html">Contact the team</a>
      </p>
    </footer>
  </body>
</html>
